services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://${EC2_PUBLIC_IP}:8080/api
    ports:
      - 5173:5173

  backend:
    build:
      context: ./backend
    ports:
      - 8080:8080
    networks:
      - chatapp-net
    environment:
      PORT: 8080
      JWT_SECRET: "${JWT_SECRET}"
      MONGODB_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@database:27017/chatapp?authSource=admin"

  database:
    image: mongo:7.0-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD}"
    volumes:
      - mongodb:/data/db
    networks:
      - chatapp-net

networks:
  chatapp-net:

volumes:
  mongodb:


